<!-- WVNCP: "Update the directory now" button.
     Paste into a Code Block on a password-protected, unlinked Squarespace page.
     Replace WORKER_URL and UPDATE_KEY with the values from setup (docs/update-button.md). -->
<div class="wvncp-update" data-worker="WORKER_URL" data-key="UPDATE_KEY">
  <p class="wvncp-update__intro">Published a new bio or edited one? The directory updates itself every night. To update it now, press the button. It takes about two minutes.</p>
  <button type="button" class="wvncp-update__btn">Update the directory now</button>
  <p class="wvncp-update__status" role="status" aria-live="polite"></p>
</div>
<style>
  .wvncp-update { max-width: 640px; margin: 0 auto; padding: 28px 32px; background: #F8F5F2; border-radius: 6.4px; }
  .wvncp-update__intro { margin: 0 0 20px; }
  .wvncp-update__btn {
    display: inline-block; padding: 14px 28px; border: 0; border-radius: 6.4px; background: #78AA42; color: #fff;
    font: inherit; font-size: 17px; letter-spacing: .04em; text-transform: uppercase; cursor: pointer;
  }
  .wvncp-update__btn:hover { background: #1D449A; }
  .wvncp-update__btn:focus-visible { outline: 3px solid #1D449A; outline-offset: 3px; }
  .wvncp-update__btn[disabled] { opacity: .6; cursor: progress; }
  .wvncp-update__status { margin: 16px 0 0; min-height: 1.5em; }
  .wvncp-update__status.is-error { color: #A12A1E; }
</style>
<script>
(function () {
  var root = document.currentScript && document.currentScript.previousElementSibling &&
    document.currentScript.previousElementSibling.previousElementSibling;
  if (!root || !root.classList.contains("wvncp-update")) root = document.querySelector(".wvncp-update");
  if (!root || root.getAttribute("data-ready")) return;
  root.setAttribute("data-ready", "1");

  var base = root.getAttribute("data-worker").replace(/\/+$/, "");
  var key = root.getAttribute("data-key");
  var btn = root.querySelector(".wvncp-update__btn");
  var out = root.querySelector(".wvncp-update__status");
  var timer = null;

  function say(text, isError) {
    out.textContent = text;
    out.classList.toggle("is-error", !!isError);
  }
  function time(iso) {
    return iso ? new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
  }
  function poll(since, tries) {
    clearTimeout(timer);
    timer = setTimeout(function () {
      fetch(base + "/status", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (s) {
        var fresh = s.startedAt && Date.parse(s.startedAt) >= since - 60000; // ignore the previous run
        if (fresh && s.state === "done") {
          btn.disabled = false;
          say("Done at " + time(s.finishedAt) + ". The directory is up to date. It can take a few more minutes to show for everyone.");
        } else if (fresh && s.state === "failed") {
          btn.disabled = false;
          say("The update didn't finish. Please try again, or contact Dodd Web Co.", true);
        } else if (tries > 60) {
          btn.disabled = false;
          say("This is taking longer than usual. Check back in a few minutes.", true);
        } else {
          say("Updating the directory… (started " + time(fresh ? s.startedAt : new Date(since).toISOString()) + ")");
          poll(since, tries + 1);
        }
      }).catch(function () { poll(since, tries + 1); });
    }, 10000);
  }

  btn.addEventListener("click", function () {
    var since = Date.now();
    btn.disabled = true;
    say("Starting the update…");
    fetch(base + "/rebuild", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key: key })
    }).then(function (r) { return r.json(); }).then(function (s) {
      if (s.state === "running") {
        if (!s.started && s.startedAt) since = Date.parse(s.startedAt);
        say(s.started ? "Update started. This takes about two minutes…" : "An update is already running. Watching it…");
        poll(since, 0);
      } else {
        btn.disabled = false;
        say(s.message || "Something went wrong. Please try again.", true);
      }
    }).catch(function () {
      btn.disabled = false;
      say("Couldn't reach the update service. Please try again, or contact Dodd Web Co.", true);
    });
  });
})();
</script>
